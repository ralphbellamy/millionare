<style>

@font-face{font-family:"Cinzel";font-weight:800;font-display:swap;src:url(cinzel-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:400;font-display:swap;src:url(figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:500;font-display:swap;src:url(figtree-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;font-display:swap;src:url(figtree-latin-600-normal.woff2) format("woff2")}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: a single game-show stage column; the prize ladder climbs beside the step card, money set in engraved capitals */
:root{
  --stage:#0b0f2a; --panel:#141a40; --panel-2:#1c2352; --line:#2c3570;
  --ink:#eef0ff; --muted:#a3a9d6; --gold:#f2c14e; --gold-deep:#b8892a;
  --go:#3fbf6e; --part:#f08a2c; --stop:#e0464a;
  --display:"Cinzel", "Copperplate", "Trajan Pro", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%, #1a2160 0%, var(--stage) 60%) fixed, var(--stage);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;padding-top:6px}
header.top .brand{flex:1 1 100%}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:.04em;color:var(--gold)}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
nav.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
nav.tabs button{padding:8px 14px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--muted)}
nav.tabs button[aria-current="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold-deep)}

.label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.muted{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;background:var(--panel-2);border:1px solid var(--line)}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#1b1405;border:0}
.btn.ghost{background:transparent}
.btn.small{padding:8px 12px;font-size:.88rem;border-radius:10px}
.btn.danger{color:#ffb3b5;border-color:#5a2a40}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* routines list */
.routines{display:flex;flex-direction:column;gap:12px}
.routine{display:flex;flex-direction:column;gap:12px}
.routine h3{font-size:1.15rem}
.routine .meta{font-size:.9rem;color:var(--muted)}
.tag{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold);border:1px solid var(--gold-deep);border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.empty{text-align:center;padding:28px 18px}

/* editor */
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field textarea{background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{resize:vertical;min-height:58px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step-edit{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.step-edit .spread .label{color:var(--gold)}
.step-edit.final .label{color:var(--gold)}
.iconbtn{width:36px;height:36px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.iconbtn:disabled{opacity:.35;cursor:default}
.confirm{background:#2a1530;border:1px solid #5a2a40;border-radius:12px;padding:12px}

/* play */
.stage-head{display:flex;flex-direction:column;gap:4px;text-align:center}
.stage-head h2{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:.03em}
.question{position:relative;text-align:center;display:flex;flex-direction:column;gap:12px;padding:22px 18px;
  background:linear-gradient(180deg,#18205a,#10153a);border:1px solid var(--gold-deep);border-radius:22px;box-shadow:0 0 0 4px rgba(242,193,78,.08),0 18px 40px rgba(0,0,0,.35)}
.forprize{font-family:var(--display);font-weight:800;color:var(--gold);font-size:1.05rem;letter-spacing:.06em}
.question h3{font-size:1.6rem;line-height:1.2}
.purpose{color:var(--muted);max-width:42ch;margin:0 auto}
.dose{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.dose span{background:var(--stage);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.answers{display:flex;flex-direction:column;gap:10px}
.answer{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:1.02rem}
.answer .key{flex:none;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;color:#0b0f2a}
.answer small{display:block;font-weight:500;color:var(--muted);font-size:.85rem}
.answer.g .key{background:var(--go)} .answer.o .key{background:var(--part)} .answer.r .key{background:var(--stop)}
.answer.g{border-color:#25603d} .answer.o{border-color:#6b4220} .answer.r{border-color:#62252a}
.reveal{display:flex;flex-direction:column;gap:14px;text-align:center}
.quip{font-size:1.15rem;font-weight:600;line-height:1.4;max-width:40ch;margin:0 auto}
.bigmoney{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,11vw,3.6rem);color:var(--gold);letter-spacing:.02em;line-height:1;text-shadow:0 0 30px rgba(242,193,78,.35)}
.stopmoney{font-family:var(--display);font-weight:800;font-size:2rem;color:var(--ink)}

.ladder{display:flex;flex-direction:column-reverse;gap:4px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.rung{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 12px;border-radius:9px;font-variant-numeric:tabular-nums;font-size:.92rem}
.rung .n{color:var(--muted);width:2.2em}
.rung .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.rung .amt{font-family:var(--display);font-weight:600;color:var(--muted)}
.rung.final .amt{color:var(--gold)}
.rung.now{background:linear-gradient(90deg,var(--gold),var(--gold-deep))}
.rung.now .n,.rung.now .nm,.rung.now .amt{color:#1b1405;font-weight:700}
.rung.done-g .amt{color:var(--go)} .rung.done-o .amt{color:var(--part)} .rung.done-r .amt{color:var(--stop)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.dot.g{background:var(--go)} .dot.o{background:var(--part)} .dot.r{background:var(--stop)} .dot.x{background:transparent;border:1.5px solid var(--line)}

/* history */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center;padding:14px 8px}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;color:var(--gold);font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.mil{font-family:var(--display);font-weight:800;color:var(--gold)}
.sync{font-size:.78rem;color:var(--muted);text-align:center}

/* surprise pictures */
.surprise{display:flex;flex-direction:column;align-items:center;gap:6px}
.surprise svg{width:150px;height:150px;max-width:100%;overflow:visible}
.surprise .cap{font-family:var(--display);font-weight:600;font-size:.85rem;letter-spacing:.06em;color:var(--gold)}
.soundbtn{padding:8px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:.85rem;color:var(--muted)}
.soundbtn[aria-pressed="true"]{color:var(--ink);border-color:var(--gold-deep)}
@media (prefers-reduced-motion:no-preference){
  .a-bob{animation:bob .6s ease-in-out infinite alternate}
  .a-bounce{animation:bounce .7s cubic-bezier(.3,1.6,.6,1) infinite alternate}
  .a-spin{animation:spin 2.4s linear infinite;transform-origin:60px 60px}
  .a-sway{animation:sway 1.4s ease-in-out infinite alternate;transform-origin:60px 115px}
  .a-wiggle{animation:wiggle .35s ease-in-out infinite alternate;transform-origin:60px 100px}
  .a-jump{animation:jump .55s ease-in-out infinite alternate}
  .a-launch{animation:launch 1.6s ease-in-out infinite}
  .a-wobble{animation:wobble .9s ease-in-out infinite;transform-origin:60px 110px}
  .a-crawl{animation:crawl 3s ease-in-out infinite alternate}
  .a-snooze{animation:snooze 2.2s ease-in-out infinite;transform-origin:60px 100px}
  .a-melt{animation:melt 2s ease-in-out infinite alternate;transform-origin:60px 110px}
  .a-rise{animation:rise2 1.6s ease-in-out infinite}
  .a-rise.d2{animation-delay:.5s}.a-rise.d3{animation-delay:1s}
  .a-twinkle{animation:twinkle 1s ease-in-out infinite alternate}
  .a-twinkle.d2{animation-delay:.5s}
  @keyframes bob{to{transform:translateY(6px) rotate(-6deg)}}
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-18px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
  @keyframes wiggle{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
  @keyframes jump{from{transform:translateY(0) scaleY(.94)}to{transform:translateY(-14px) scaleY(1.04)}}
  @keyframes launch{0%{transform:translateY(8px)}50%{transform:translateY(-22px)}100%{transform:translateY(8px)}}
  @keyframes wobble{0%,100%{transform:skewX(0) scaleY(1)}25%{transform:skewX(8deg) scaleY(.95)}75%{transform:skewX(-8deg) scaleY(1.04)}}
  @keyframes crawl{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
  @keyframes snooze{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.95)}}
  @keyframes melt{from{transform:scaleY(1)}to{transform:scaleY(.9) scaleX(1.05)}}
  @keyframes rise2{0%{transform:translateY(6px);opacity:0}40%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
  @keyframes twinkle{from{opacity:.2;transform:scale(.7)}to{opacity:1;transform:scale(1.1)}}
}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:420px){.grid2{grid-template-columns:1fr 1fr}.question h3{font-size:1.4rem}}
@media (prefers-reduced-motion:no-preference){.question,.reveal{animation:rise .35s ease-out}@keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>

</div>

function pickVoice(cat){ const v=pick(VOICES,lastVoice); lastVoice=v; return {who:v.who,langs:v.langs,rate:v.rate,pitch:v.pitch,line:pick(v[cat],lastQuip)}; }
function pick(arr, last){ let q; do { q = arr[Math.floor(Math.random()*arr.length)]; } while (arr.length>1 && q===last); return q; }

/* ---------- prize ladder ---------- */
const BASE=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
function ladder(n){
  if(n<=0) return [];
  if(n<=BASE.length) return BASE.slice(BASE.length-n);
  const out=[]; for(let i=0;i<n;i++){ const v=Math.round(100*Math.pow(10000,i/(n-1))); out.push(i===n-1?1000000:v); } return out;
}
const money=v=>"$"+v.toLocaleString("en-US");

/* ---------- storage: claude db when available, device storage otherwise ---------- */
const LS="routine-millionaire-v1";
let docs={}; let col=null;
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS)||"{}"); }catch(e){ return {}; } }
function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify(docs)); }catch(e){} }
async function put(doc){ docs[doc.id]=doc; lsSave(); if(col){ try{ await col.doc(doc.id).set(doc); }catch(e){ setSync("Saved on this device (cloud save failed)"); } } }
async function del(id){ delete docs[id]; lsSave(); if(col){ try{ await col.doc(id).delete(); }catch(e){} } }
function setSync(t){ document.getElementById("sync").textContent=t; }
const routines=()=>Object.values(docs).filter(d=>d.kind==="routine").sort((a,b)=>(a.created||0)-(b.created||0));
const sessions=()=>Object.values(docs).filter(d=>d.kind==="session").sort((a,b)=>(b.ts||0)-(a.ts||0));
const uid=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function ensureExample(){

function startPlay(id){ const r=docs[id]; play={r, lad:ladder(r.steps.length), i:0, results:[], phase:"ask", quip:"", ended:false}; go("play"); }

function ladderHTML(){
  const {r,lad,i,results}=play;
  return `<div class="ladder" aria-label="Prize ladder">${r.steps.map((s,k)=>{
    let cls = k===r.steps.length-1?"final ":"";
    if(results[k]) cls+="done-"+results[k][0]; else if(k===i && play.phase==="ask") cls+="now";
    return `<div class="rung ${cls}"><span class="n">${k+1}</span><span class="nm">${esc(s.name)}</span><span class="amt">${money(lad[k])}</span></div>`;
  }).join("")}</div>`;
}
function banked(){ let v=0; play.results.forEach((x,k)=>{ if(x!=="red") v=play.lad[k]; }); return v; }

  const {r,lad,i}=play, s=r.steps[i], last=i===r.steps.length-1;

      ${surpriseHTML()}${quipHTML()}<button class="btn gold" id="next">Next: ${money(lad[i+1])}${i+1===r.steps.length-1?" · the millionaire step":""}</button></section>`;

  } else {

async function answer(a){
  const p=play, last=p.i===p.r.steps.length-1;
  p.results[p.i]=a;
  const cat = a==="red" ? "stop" : last ? "millionaire" : a;
  const vq = pickVoice(cat); p.quip=lastQuip=vq.line; p.voice=vq;
  const roll=Math.random();
  if(a==="red"){ p.phase="stopped"; p.pic=Math.random()<.5?pickPic("sleepy"):null; if(roll<.35) play_sfx("red"); else if(roll<.65) say(vq); }
  else if(last){ p.phase="millionaire"; p.pic=Math.random()<.75?pickPic("rich"):null; millionaireSound(); confetti(); if(roll<.5) setTimeout(()=>say(vq),3200); }
  else { p.phase="next"; p.pic=Math.random()<.5?pickPic(a==="green"?"happy":"wobbly"):null; if(roll<.35) play_sfx(a); else if(roll<.6) say(vq); }
  if(a==="red"||last) p.ended=true;
  render(); window.scrollTo(0,0);
  if(a==="red") await finish(false); else if(last) await finish(true);
}

async function finish(mil){
  const p=play; p.ended=true;
  const now=new Date(), date=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  const steps=p.r.steps.map((s,k)=>({name:s.name,times:s.times,reps:s.reps,status:p.results[k]||"not reached"}));
  const c=k=>p.results.filter(x=>x===k).length;
  await put({id:uid("x"),kind:"session",date,ts:now.getTime(),routineId:p.r.id,routine:p.r.name,steps,green:c("green"),orange:c("orange"),red:c("red"),millionaire:mil,prize:mil?1000000:banked()});
}

function surpriseHTML(){ const p=play.pic; if(!p) return ""; return `<figure class="surprise" style="margin:0"><svg viewBox="0 0 120 120" role="img" aria-label="${esc(p.cap)}"><g class="${p.a}">${p.s}</g></svg><figcaption class="cap">${esc(p.cap)}</figcaption></figure>`; }
function quipHTML(){ const w=play.voice; return `<p class="quip" style="margin:0">${esc(play.quip)}</p>`; }
let phoneVoices=[];
function loadVoices(){ try{ phoneVoices=window.speechSynthesis.getVoices()||[]; }catch(e){} }
try{ if(window.speechSynthesis){ loadVoices(); window.speechSynthesis.onvoiceschanged=loadVoices; } }catch(e){}
const norm=l=>String(l||"").replace("_","-").toLowerCase();
function voiceFor(langs, who){
  if(!phoneVoices.length) loadVoices();
  const pickStable=list=>{ const local=list.filter(v=>v.localService); const pool=local.length?local:list; let h=0; for(const c of who) h=(h*31+c.charCodeAt(0))>>>0; return pool[h%pool.length]; };
  for(const l of langs||[]){ const m=phoneVoices.filter(v=>norm(v.lang)===norm(l)); if(m.length) return pickStable(m); }
  for(const l of langs||[]){ const m=phoneVoices.filter(v=>norm(v.lang).startsWith(norm(l).slice(0,2))); if(m.length) return pickStable(m); }
  return null;
}
function say(vq){ if(!soundOn) return; try{ const s=window.speechSynthesis; if(!s) return; s.cancel(); const u=new SpeechSynthesisUtterance(vq.line); const v=voiceFor(vq.langs, vq.who); if(v){ u.voice=v; u.lang=v.lang; } else u.lang=(vq.langs&&vq.langs[0])||"en-US"; u.rate=vq.rate; u.pitch=vq.pitch; s.speak(u); }catch(e){} }
let lastPic=null;
function pickPic(set){ const arr=set==="rich"?[...PICS.rich,...PICS.rich,...PICS.happy]:PICS[set]; const p=pick(arr,lastPic); lastPic=p; return p; }

/* ---------- silly sound library (plays after a tap, so browsers allow it) ---------- */
let soundOn=true; try{ soundOn=localStorage.getItem(LS+"-sound")!=="off"; }catch(e){}
let ac=null, master=null;
function A(){ if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.9; const comp=ac.createDynamicsCompressor(); master.connect(comp).connect(ac.destination); } if(ac.state==="suspended") ac.resume(); return ac; }
function v(type,f0,f1,t0,d,g=.15,o={}){ const c=A(), t=c.currentTime+t0, os=c.createOscillator(), gn=c.createGain(); os.type=type; os.frequency.setValueAtTime(f0,t); if(f1!==f0) os.frequency.exponentialRampToValueAtTime(f1,t+d);
  gn.gain.setValueAtTime(.0001,t); gn.gain.exponentialRampToValueAtTime(g,t+.015); gn.gain.setValueAtTime(g,t+Math.max(.02,d*(o.hold||.3))); gn.gain.exponentialRampToValueAtTime(.0001,t+d);
  if(o.vib){ const l=c.createOscillator(), lg=c.createGain(); l.frequency.value=o.vib[0]; lg.gain.value=o.vib[1]; l.connect(lg).connect(os.frequency); l.start(t); l.stop(t+d+.05); }
  let n=os; if(o.f){ const f=c.createBiquadFilter(); f.type=o.f[0]; f.frequency.value=o.f[1]; f.Q.value=o.f[2]||1; n.connect(f); n=f; }
  n.connect(gn).connect(master); os.start(t); os.stop(t+d+.05); }
let nbuf=null;
function noise(t0,d,g=.2,ft="bandpass",ff=1500,q=.8){ const c=A(); if(!nbuf){ nbuf=c.createBuffer(1,c.sampleRate*2,c.sampleRate); const ch=nbuf.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1; }
  const s=c.createBufferSource(); s.buffer=nbuf; const f=c.createBiquadFilter(); f.type=ft; f.frequency.value=ff; f.Q.value=q; const gn=c.createGain(), t=c.currentTime+t0;
  gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(.0001,t+d); s.connect(f).connect(gn).connect(master); s.start(t,Math.random()); s.stop(t+d+.05); }
const SFX={
  boing:()=>v("sine",900,110,0,.6,.25,{vib:[18,60],hold:.05}),
  slideUp:()=>v("sine",300,1400,0,.7,.18,{vib:[6,12],hold:.8}),
  quack:()=>{ v("sawtooth",620,380,0,.16,.16,{f:["bandpass",1100,3]}); v("sawtooth",600,360,.22,.2,.16,{f:["bandpass",1100,3]}); },
  ding:()=>{ noise(0,.04,.25,"highpass",4000); v("sine",1568,1568,0,1.1,.16,{hold:.02}); v("sine",2093,2093,.06,1.2,.12,{hold:.02}); },
  xylophone:()=>[523,659,784,988,1175,1568].forEach((f,k)=>v("sine",f,f,k*.07,.35,.16,{hold:.02})),
  laser:()=>{ v("square",1800,90,0,.35,.08); v("square",1800,90,.18,.35,.06); },
  honk:()=>{ v("square",220,210,0,.22,.1,{f:["lowpass",900]}); v("square",233,222,0,.22,.08,{f:["lowpass",900]}); v("square",220,210,.3,.32,.1,{f:["lowpass",900]}); v("square",233,222,.3,.32,.08,{f:["lowpass",900]}); },
  cuckoo:()=>{ v("sine",784,784,0,.25,.2); v("sine",622,622,.28,.4,.2); v("sine",784,784,.8,.25,.2); v("sine",622,622,1.08,.4,.2); },
  kazoo:()=>[392,392,440,392,523,494].forEach((f,k)=>v("sawtooth",f,f,k*.16,k===5?.4:.15,.09,{f:["bandpass",1200,2],vib:[28,8],hold:.8})),
  pop:()=>{ v("sine",400,1600,0,.08,.25,{hold:.1}); v("sine",600,2000,.15,.08,.2,{hold:.1}); v("sine",500,1800,.3,.08,.22,{hold:.1}); },
  wobble:()=>v("triangle",420,380,0,1,.16,{vib:[7,90],hold:.8}),
  sadTrombone:()=>[[392,.35],[370,.35],[349,.35],[330,1.1]].reduce((t,[f,d],k)=>{ v("sawtooth",f,k===3?f*.97:f,t,d,.1,{f:["lowpass",1100],vib:k===3?[6,10]:[0,0],hold:.85}); return t+d; },0),
  slideDown:()=>v("sine",1300,200,0,.9,.18,{vib:[6,10],hold:.8}),
  snore:()=>{ noise(0,.9,.18,"lowpass",420,4); v("sawtooth",80,70,0,.9,.06,{f:["lowpass",300]}); noise(1.1,.5,.1,"highpass",3000); },
  drumroll:()=>{ for(let k=0;k<28;k++) noise(k*.045,.06,.05+k*.006,"bandpass",900,.6); noise(1.3,1.6,.3,"highpass",6000,.5); },
  fanfare:()=>[[523,0,.16],[659,.16,.16],[784,.32,.16],[1047,.48,.5],[784,1.0,.16],[1047,1.16,1]].forEach(([f,t,d])=>{ v("sawtooth",f,f,t,d,.07,{f:["lowpass",2600],hold:.85}); v("square",f/2,f/2,t,d,.04,{f:["lowpass",1500],hold:.85}); }),
  applause:()=>{ for(let k=0;k<90;k++) noise(Math.random()*2.6,.05,.08+Math.random()*.1,"bandpass",1400+Math.random()*1800,1.2); }
};
const SOUNDS={ green:["boing","slideUp","quack","ding","xylophone","laser","honk","cuckoo","kazoo","pop"], orange:["wobble","boing","honk","quack","slideUp"], red:["sadTrombone","slideDown","snore"] };
let lastSnd="";
function play_sfx(set){ if(!soundOn) return; try{ const name=pick(SOUNDS[set],lastSnd); lastSnd=name; SFX[name](); }catch(e){} }
function millionaireSound(){ if(!soundOn) return; try{ SFX.drumroll(); setTimeout(()=>{ SFX.fanfare(); SFX.applause(); },1500); }catch(e){} }
function setSoundBtn(){ const b=document.getElementById("soundbtn"); if(b){ b.setAttribute("aria-pressed",soundOn); b.textContent=soundOn?"Sound on":"Sound off"; } }
document.getElementById("soundbtn").onclick=()=>{ soundOn=!soundOn; try{ localStorage.setItem(LS+"-sound",soundOn?"on":"off"); }catch(e){} setSoundBtn(); if(soundOn) SFX.ding(); };
setSoundBtn();

/* ---------- confetti ---------- */
function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.getElementById("confetti"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#f2c14e","#3fbf6e","#f08a2c","#eef0ff","#8fa0ff"];
  const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6,s:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0; (function f(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); }); if(++t<260) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}
